// Mock admin-set exceptions that override the regular weekly schedule for a specific date.
const ADMIN_CLOSURES = [
  { date: "2026-09-26", reason: "Staff training day" },
  { date: "2026-11-11", reason: "Public holiday" },
];

function pad2(n) {
  return String(n).padStart(2, "0");
}

function toDateKey(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function getMonthGrid(monthDate) {
  const firstOfMonth = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const gridStart = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1 - firstOfMonth.getDay());
  return Array.from({ length: 42 }, (_, i) =>
    new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i)
  );
}

function getDayAvailability(date) {
  const closure = ADMIN_CLOSURES.find((c) => c.date === toDateKey(date));
  if (closure) return { isOpen: false, hours: "Closed", reason: closure.reason };
  const weekday = HOURS_BY_JSDAY[date.getDay()];
  return { isOpen: !weekday.closed, hours: weekday.hours, reason: null };
}

function buildHoursSummary() {
  const open = CLINIC_HOURS.filter((h) => !h.closed);
  const closed = CLINIC_HOURS.filter((h) => h.closed);
  let summary = open.map((h) => `${h.day} ${h.hours}`).join(", ");
  if (closed.length) summary += `. Closed on ${closed.map((h) => h.day).join(", ")}.`;
  return summary;
}

function ClinicCalendar() {
  const today = useMemo(() => new Date(), []);
  const [month, setMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [selectedDate, setSelectedDate] = useState(today);

  const days = useMemo(() => getMonthGrid(month), [month]);
  const selectedAvailability = useMemo(() => getDayAvailability(selectedDate), [selectedDate]);

  function goToMonth(offset) {
    setMonth((m) => new Date(m.getFullYear(), m.getMonth() + offset, 1));
  }

  return (
    <div className="cal">
      <div className="cal__header">
        <button type="button" className="cal__nav-btn" onClick={() => goToMonth(-1)} aria-label="Previous month">
          <ChevronLeftIcon />
        </button>
        <p className="cal__month">{month.toLocaleDateString(undefined, MONTH_LABEL_FORMAT)}</p>
        <button type="button" className="cal__nav-btn" onClick={() => goToMonth(1)} aria-label="Next month">
          <ChevronRightIcon />
        </button>
      </div>

      <div className="cal__weekdays">
        {WEEKDAY_LABELS.map((label, i) => (
          <span key={i}>{label}</span>
        ))}
      </div>

      <div className="cal__grid">
        {days.map((date) => {
          const availability = getDayAvailability(date);
          const outsideMonth = date.getMonth() !== month.getMonth();
          const classes = [
            "cal__day",
            outsideMonth && "cal__day--muted",
            isSameDay(date, today) && "cal__day--today",
            isSameDay(date, selectedDate) && "cal__day--selected",
          ].filter(Boolean).join(" ");

          return (
            <button type="button" key={date.toISOString()} className={classes} onClick={() => setSelectedDate(date)}>
              <span className="cal__day-num">{date.getDate()}</span>
              <span className={`cal__day-dot ${availability.isOpen ? "cal__day-dot--open" : "cal__day-dot--closed"}`} />
            </button>
          );
        })}
      </div>

      <div className="cal__legend">
        <span><span className="cal__day-dot cal__day-dot--open" /> Open</span>
        <span><span className="cal__day-dot cal__day-dot--closed" /> Closed</span>
      </div>

      <div className={`cal__detail ${selectedAvailability.isOpen ? "cal__detail--open" : "cal__detail--closed"}`}>
        <p className="cal__detail-date">
          {selectedDate.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}
        </p>
        <p className="cal__detail-status">
          {selectedAvailability.isOpen ? `Open · ${selectedAvailability.hours}` : "Closed"}
          {selectedAvailability.reason ? ` — ${selectedAvailability.reason}` : ""}
        </p>
      </div>
    </div>
  );
}

function ChatAssistant() {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState(() => [
    { id: "intro", from: "bot", text: "Hi! I'm the Vet Vision Assistant. Ask me about our hours, appointments, or services — or tap a question below." },
  ]);
  const [askedIds, setAskedIds] = useState(() => new Set());
  const [draft, setDraft] = useState("");
  const [typing, setTyping] = useState(false);
  const listRef = useRef(null);
  const typingTimeoutRef = useRef(null);

  const remainingFaqs = FAQ_ITEMS.filter((item) => !askedIds.has(item.id));

  useEffect(() => {
    if (open && listRef.current) {
      listRef.current.scrollTop = listRef.current.scrollHeight;
    }
  }, [messages, typing, open]);

  useEffect(() => {
    return () => {
      if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);
    };
  }, []);

  function pushExchange(questionText, answerText, itemId) {
    if (itemId) {
      setAskedIds((prev) => new Set(prev).add(itemId));
    }
    setMessages((m) => [...m, { id: `${Date.now()}-q`, from: "user", text: questionText }]);
    setTyping(true);
    typingTimeoutRef.current = setTimeout(() => {
      setMessages((m) => [...m, { id: `${Date.now()}-a`, from: "bot", text: answerText }]);
      setTyping(false);
    }, 700 + Math.random() * 500);
  }

  function handleQuickAsk(item) {
    if (typing) return;
    pushExchange(item.label, item.answer, item.id);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (typing) return;
    const trimmed = draft.trim();
    if (!trimmed) return;
    pushExchange(trimmed, findFaqAnswer(trimmed));
    setDraft("");
  }

  return (
    <>
      <button
        type="button"
        className={`chat-fab ${open ? "chat-fab--hidden" : ""}`}
        onClick={() => setOpen(true)}
        aria-label="Open Vet Vision Assistant"
      >
        <img src="Images/EcovetLogo 1.png" alt="" className="chat-fab__logo" />
      </button>

      {open && (
        <>
          <div className="chat-scrim" onClick={() => setOpen(false)} />
          <div className="chat-panel" role="dialog" aria-label="Vet Vision Assistant">
          <div className="chat-panel__header">
            <span className="chat-panel__avatar">
              <img src="Images/EcovetLogo 1.png" alt="" />
            </span>
            <div className="chat-panel__info">
              <p className="chat-panel__title">Vet Vision Assistant</p>
              <p className="chat-panel__subtitle">Quick answers about the clinic</p>
            </div>
            <button type="button" className="chat-panel__close" onClick={() => setOpen(false)} aria-label="Close assistant">
              <CloseIcon />
            </button>
          </div>

          <div className="chat-panel__messages" ref={listRef}>
            {messages.map((m) => (
              <div key={m.id} className={`chat-row chat-row--${m.from}`}>
                {m.from === "bot" && (
                  <span className="chat-avatar">
                    <img src="Images/EcovetLogo 1.png" alt="" />
                  </span>
                )}
                <div className={`chat-msg chat-msg--${m.from}`}>{m.text}</div>
              </div>
            ))}

            {typing && (
              <div className="chat-row chat-row--bot">
                <span className="chat-avatar">
                  <img src="Images/EcovetLogo 1.png" alt="" />
                </span>
                <div className="chat-msg chat-msg--bot chat-typing">
                  <span className="chat-typing__dot" />
                  <span className="chat-typing__dot" />
                  <span className="chat-typing__dot" />
                </div>
              </div>
            )}

            {!typing && remainingFaqs.length > 0 && (
              <div className="chat-suggestions">
                {remainingFaqs.map((item) => (
                  <button type="button" key={item.id} className="chat-chip" onClick={() => handleQuickAsk(item)}>
                    {item.label}
                  </button>
                ))}
              </div>
            )}
          </div>

          <form className="chat-panel__input" onSubmit={handleSubmit}>
            <input
              type="text"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              placeholder="Type a question…"
              aria-label="Type a question"
              disabled={typing}
            />
            <button type="submit" className="chat-panel__send" aria-label="Send" disabled={typing || !draft.trim()}>
              <SendIcon />
            </button>
          </form>
          </div>
        </>
      )}
    </>
  );
}

function NotificationButton({ open, onToggle, onClose }) {
  return (
    <div className="notif">
      <button
        type="button"
        className={`topbar__notif ${open ? "topbar__notif--active" : ""}`}
        onClick={onToggle}
        aria-label="Notifications"
        aria-expanded={open}
      >
        <BellIcon />
      </button>

      {open && (
        <>
          <div className="notif-scrim" onClick={onClose} />
          <div className="notif-panel">
            <div className="notif-panel__header">
              <p className="notif-panel__title">Notifications</p>
              <button type="button" className="notif-panel__close" onClick={onClose} aria-label="Close notifications">
                <CloseIcon />
              </button>
            </div>
            <div className="empty-state">
              <span className="empty-state__icon"><BellIcon /></span>
              <p className="empty-state__title">No notifications yet</p>
              <p className="empty-state__text">
                You'll see clinic updates and reminders here once this is connected.
              </p>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function ToggleSwitch({ checked, onChange, label }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      aria-label={label}
      className={`toggle ${checked ? "toggle--on" : ""}`}
      onClick={() => onChange(!checked)}
    >
      <span className="toggle__knob" />
    </button>
  );
}

function HomeScreen({ email, page, onOpenNav, darkMode, onToggleDarkMode, notifsEnabled, onToggleNotifs }) {
  const [notifOpen, setNotifOpen] = useState(false);
  const [selectedPet, setSelectedPet] = useState(null);
  const [selectedHistoryPet, setSelectedHistoryPet] = useState(null);

  const firstName = useMemo(() => {
    const handle = email.split("@")[0] || "there";
    return handle.charAt(0).toUpperCase() + handle.slice(1);
  }, [email]);

  const initials = useMemo(() => firstName.slice(0, 2).toUpperCase(), [firstName]);

  const activeItem = useMemo(() => NAV_ITEMS.find((item) => item.id === page), [page]);

  const today = useMemo(() => new Date(), []);
  const todayAvailability = useMemo(() => getDayAvailability(today), [today]);
  const todayLabel = useMemo(
    () => today.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }),
    [today]
  );

  const notifButton = (
    <NotificationButton open={notifOpen} onToggle={() => setNotifOpen((v) => !v)} onClose={() => setNotifOpen(false)} />
  );
  const menuButton = (
    <button type="button" className="topbar__menu" onClick={onOpenNav} aria-label="Open menu">
      <MenuIcon />
    </button>
  );

  return (
    <>
      {page === "home" && (
        <main className="content home-content">
          <div className="page-topbar">
            {menuButton}
            <p className="page-greeting page-topbar__title">Hi {firstName}</p>
            {notifButton}
          </div>

          <div className="records-card">
            <div className="records-card__top">
              <span className={`status-pill ${todayAvailability.isOpen ? "status-pill--open" : "status-pill--closed"}`}>
                <span className="status-dot" />
                {todayAvailability.isOpen ? "Open today" : "Closed today"}
              </span>
            </div>

            <div className="records-card__body">
              <div className="records-card__text">
                <h2>{todayLabel}</h2>
                <p className="records-card__meta">
                  {todayAvailability.isOpen ? `Open · ${todayAvailability.hours}` : "Closed"}
                  {todayAvailability.reason ? ` — ${todayAvailability.reason}` : ""}
                </p>
              </div>
            </div>
          </div>
        </main>
      )}

      {page === "calendar" && (
        <main className="content home-content">
          <div className="page-topbar">
            {menuButton}
            <div className="section-head page-topbar__title">
              <h1 className="page-title">Calendar</h1>
              <span className={`status-pill ${CLINIC_STATUS.isOpen ? "status-pill--open" : "status-pill--closed"}`}>
                <span className="status-dot" />
                {CLINIC_STATUS.label}
              </span>
            </div>
            {notifButton}
          </div>

          <div className="calendar-layout">
            <ClinicCalendar />

            <div className="calendar-side">
              <div className="section-head">
                <h3>Weekly hours</h3>
              </div>

              <div className="availability-list">
                {CLINIC_HOURS.map((h) => (
                  <div className="availability-row" key={h.day}>
                    <span className="availability-row__day">{h.day}</span>
                    <span className={`availability-row__hours ${h.closed ? "availability-row__hours--closed" : ""}`}>
                      {h.hours}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </main>
      )}

      {page === "records" && (
        <main className="content home-content">
          <div className="page-topbar">
            {menuButton}
            <h1 className="page-title page-topbar__title">Records</h1>
            {notifButton}
          </div>

          <div className="records-list">
            {PETS.map((pet) => (
              <div className="records-card" key={pet.id}>
                <div className="records-card__body">
                  <div className="records-card__text">
                    <p className="records-card__eyebrow">Medical Records</p>
                    <h2>{pet.name}'s Health History</h2>
                    <p className="records-card__meta">Last checkup: {pet.lastCheckup} · {pet.note}</p>
                    <button type="button" className="records-card__cta" onClick={() => setSelectedHistoryPet(pet)}>
                      View records <ArrowRightIcon />
                    </button>
                  </div>
                  <span className="records-card__avatar"><PawIcon /></span>
                </div>
              </div>
            ))}
          </div>

          {selectedHistoryPet && (
            <PetHistoryModal pet={selectedHistoryPet} onDismiss={() => setSelectedHistoryPet(null)} />
          )}
        </main>
      )}

      {page === "settings" && (
        <main className="content home-content">
          <div className="page-topbar">
            {menuButton}
            <h1 className="page-title page-topbar__title">Settings</h1>
            {notifButton}
          </div>

          <div className="settings-card">
            <p className="settings-card__label">Profile</p>
            <div className="profile-row">
              <span className="profile-avatar">{initials}</span>
              <div>
                <p className="profile-row__name">{firstName}</p>
                <p className="profile-row__email">{email}</p>
              </div>
            </div>
          </div>

          <div className="settings-card">
            <p className="settings-card__label">My Pets</p>
            <div className="pet-list">
              {PETS.map((pet) => (
                <button type="button" className="pet-row" key={pet.id} onClick={() => setSelectedPet(pet)}>
                  <span className="pet-row__icon"><PetIcon species={pet.species} /></span>
                  <div>
                    <p className="pet-row__name">{pet.name}</p>
                    <p className="pet-row__meta">{pet.species} · {pet.breed}</p>
                  </div>
                  <ChevronRightIcon />
                </button>
              ))}
            </div>
          </div>

          {selectedPet && <PetDetailModal pet={selectedPet} onDismiss={() => setSelectedPet(null)} />}

          <div className="settings-card">
            <p className="settings-card__label">System</p>
            <div className="settings-toggle-row">
              <div>
                <p className="settings-toggle-row__title">Dark mode</p>
                <p className="settings-toggle-row__desc">Switch the app to a dark color theme.</p>
              </div>
              <ToggleSwitch checked={darkMode} onChange={onToggleDarkMode} label="Toggle dark mode" />
            </div>
            <div className="settings-toggle-row">
              <div>
                <p className="settings-toggle-row__title">Notifications</p>
                <p className="settings-toggle-row__desc">Get notified about clinic updates and reminders.</p>
              </div>
              <ToggleSwitch checked={notifsEnabled} onChange={onToggleNotifs} label="Toggle notifications" />
            </div>
          </div>
        </main>
      )}

      {page !== "home" && page !== "calendar" && page !== "records" && page !== "settings" && (
        <main className="content home-content">
          <div className="page-topbar">
            {menuButton}
            <h1 className="page-title page-topbar__title">{activeItem?.label}</h1>
            {notifButton}
          </div>

          <div className="placeholder-page">
            <div className="placeholder-page__icon">{activeItem?.icon}</div>
            <h2>{activeItem?.label}</h2>
            <p>This section is coming soon.</p>
          </div>
        </main>
      )}
    </>
  );
}

function App() {
  const [view, setView] = useState("login");
  const [email, setEmail] = useState("");
  const [page, setPage] = useState("home");
  const [navExpanded, setNavExpanded] = useState(false);
  const [darkMode, setDarkMode] = useState(() => {
    try {
      return localStorage.getItem("vv-dark-mode") === "1";
    } catch {
      return false;
    }
  });
  const [notifsEnabled, setNotifsEnabled] = useState(() => {
    try {
      return localStorage.getItem("vv-notifs-enabled") !== "0";
    } catch {
      return true;
    }
  });

  useEffect(() => {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", "#F5F9F6");
  }, [view]);

  useEffect(() => {
    try {
      localStorage.setItem("vv-dark-mode", darkMode ? "1" : "0");
    } catch {}
  }, [darkMode]);

  useEffect(() => {
    try {
      localStorage.setItem("vv-notifs-enabled", notifsEnabled ? "1" : "0");
    } catch {}
  }, [notifsEnabled]);

  function handleContinue(value) {
    setEmail(value);
    setView("home");
  }

  function handleLogout() {
    setView("login");
    setEmail("");
    setPage("home");
    setNavExpanded(false);
  }

  function handleNavigate(id) {
    setPage(id);
    setNavExpanded(false);
  }

  if (view === "login") {
    return <LoginScreen onContinue={handleContinue} />;
  }

  return (
    <div className={`home-page ${navExpanded ? "home-page--nav-expanded" : ""} ${darkMode ? "dark" : ""}`}>
      <SideNav
        page={page}
        expanded={navExpanded}
        onExpand={() => setNavExpanded(true)}
        onCollapse={() => setNavExpanded(false)}
        onToggle={() => setNavExpanded((v) => !v)}
        onNavigate={handleNavigate}
        onLogout={handleLogout}
      />
      <div className="sidenav-backdrop" onClick={() => setNavExpanded(false)} />
      <div className="home-container">
        <HomeScreen
          email={email}
          page={page}
          onOpenNav={() => setNavExpanded(true)}
          darkMode={darkMode}
          onToggleDarkMode={() => setDarkMode((v) => !v)}
          notifsEnabled={notifsEnabled}
          onToggleNotifs={() => setNotifsEnabled((v) => !v)}
        />
      </div>
      <ChatAssistant />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
